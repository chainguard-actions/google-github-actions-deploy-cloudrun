name: Test invalid gcloud_component input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with invalid gcloud_component (expect failure)
        id: action
        uses: .
        with:
          service: 'my-service'
          image: 'us-docker.pkg.dev/cloudrun/container/hello:latest'
          region: 'us-central1'
          gcloud_component: 'invalid-component-xyz'
        continue-on-error: true

      - name: Assert action failed due to invalid gcloud_component
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail with an invalid gcloud_component"
            exit 1
          fi
          echo "PASS: action correctly failed with an invalid gcloud_component"
