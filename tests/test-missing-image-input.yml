name: Test missing image/source input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with service but no image or source (expect failure)
        id: action
        uses: .
        with:
          service: 'my-service'
          region: 'us-central1'
        continue-on-error: true

      - name: Assert action failed due to missing image/source
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail when no image or source is provided"
            exit 1
          fi
          echo "PASS: action correctly failed when image/source was not provided"
