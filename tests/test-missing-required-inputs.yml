name: Test missing required inputs validation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          image: us-docker.pkg.dev/cloudrun/container/hello:latest
          # Intentionally omitting service, job, and metadata to trigger validation error

      - name: Assert action failed due to missing required inputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed as expected (no service/job/metadata provided)"
          elif [ "$OUTCOME" = "success" ]; then
            echo "FAIL: action should have failed without service/job/metadata"
            exit 1
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
