name: Test service deploy with env_vars (no credentials)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          service: my-test-service
          image: us-docker.pkg.dev/cloudrun/container/hello:latest
          region: us-central1
          env_vars: |-
            FRUIT=apple
            COLOR=blue
          env_vars_update_strategy: merge

      - name: Assert action failed gracefully (no GCP credentials with env_vars)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (no GCP credentials available)"
          elif [ "$OUTCOME" = "success" ]; then
            URL="${{ steps.action.outputs.url }}"
            echo "url: $URL"
            if [ -z "$URL" ]; then
              echo "FAIL: action succeeded but url output is empty"
              exit 1
            fi
            echo "PASS: action succeeded with url=$URL"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
