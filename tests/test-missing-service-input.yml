name: Test missing service/job/metadata input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action without service, job, or metadata (expect failure)
        id: action
        uses: .
        with:
          image: 'us-docker.pkg.dev/cloudrun/container/hello:latest'
          region: 'us-central1'
        continue-on-error: true

      - name: Assert action failed due to missing service/job/metadata
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail when no service/job/metadata is provided"
            exit 1
          fi
          echo "PASS: action correctly failed when service/job/metadata was not provided"
